<!doctype html>
<!--
  A made-up AWS "launch an instance" page in the shape of Cloudscape: labels
  tied with for / aria-labelledby, descriptions with aria-describedby, a
  select drawn as a button, a toggle that is a checkbox with role="switch".
  Used by test/extract.test.ts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Launch an instance | EC2 | us-east-1</title>
  </head>
  <body>
    <div role="banner"><input type="search" aria-label="Search" /><button type="button">us-east-1</button></div>
    <nav aria-label="Breadcrumbs">
      <ol>
        <li><a href="#">EC2</a></li>
        <li><a href="#">Instances</a></li>
        <li><span>Launch an instance</span></li>
      </ol>
    </nav>
    <main>
      <h1>Launch an instance</h1>
      <div class="awsui_container">
        <h2>Name and tags</h2>
        <div class="awsui_form-field">
          <label class="awsui_label" for="name-input">Name</label>
          <div class="awsui_description" id="name-desc">A tag with the key "Name".</div>
          <input id="name-input" type="text" aria-describedby="name-desc" value="pixelweb" />
        </div>
      </div>
      <div class="awsui_container">
        <h2>Instance type</h2>
        <div class="awsui_form-field">
          <label class="awsui_label" id="type-label">Instance type</label>
          <button type="button" aria-haspopup="listbox" aria-labelledby="type-label"><span>t3.micro</span></button>
        </div>
        <div class="awsui_form-field">
          <label class="awsui_label" id="key-label">Key pair name</label>
          <button type="button" aria-haspopup="listbox" aria-labelledby="key-label"><span class="awsui_placeholder">Select</span></button>
          <div class="awsui_constraint">You can use a key pair to securely connect to your instance.</div>
        </div>
      </div>
      <div class="awsui_container">
        <h2>Network settings</h2>
        <div class="awsui_form-field">
          <input type="checkbox" role="switch" aria-label="Auto-assign public IP" checked />
        </div>
        <fieldset>
          <legend>Firewall (security groups)</legend>
          <label><input type="radio" name="fw" checked /> Create security group</label>
          <label><input type="radio" name="fw" /> Select existing security group</label>
        </fieldset>
        <div class="awsui_form-field">
          <label class="awsui_label" for="ssh-from">Allow SSH traffic from</label>
          <select id="ssh-from">
            <option selected>Anywhere 0.0.0.0/0</option>
            <option>My IP</option>
          </select>
        </div>
      </div>
      <div class="awsui_container">
        <h2>Configure storage</h2>
        <div class="awsui_form-field">
          <label class="awsui_label" for="size">Size (GiB)</label>
          <input id="size" role="spinbutton" value="8" aria-required="true" />
        </div>
      </div>
    </main>
  </body>
</html>
