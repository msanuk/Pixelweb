<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelWeb</title>
    <script>
      // Apply the saved theme, zoom and density before first paint (see src/lib/theme.ts, src/lib/settings.ts).
      try {
        var t = localStorage.getItem('pixelweb.theme');
        if (t === 'paper' || t === 'graphite') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('pixelweb.palette') === 'clay') document.documentElement.dataset.palette = 'clay';
        var s = JSON.parse(localStorage.getItem('pixelweb.settings') || '{}');
        if ([90, 110, 125].indexOf(s.scale) >= 0) document.documentElement.style.zoom = String(s.scale / 100);
        if (s.density === 'compact') document.documentElement.dataset.density = 'compact';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
